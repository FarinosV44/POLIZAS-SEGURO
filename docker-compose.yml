# Despliegue de referencia: aplicación + worker de avisos + PostgreSQL + Caddy (HTTPS automático).
# Las variables y secretos van en el archivo .env del servidor (ver .env.example), nunca en el repositorio.
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polizas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-polizas}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polizas}"], interval: 10s, retries: 10 }

  migrar:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgres://${POSTGRES_USER:-polizas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-polizas}" }
    command: ["npm", "run", "db:migrate"]
    depends_on: { db: { condition: service_healthy } }

  web:
    build: .
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-polizas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-polizas}"
      STORAGE_DIR: /datos/documentos
    volumes: [documentos:/datos/documentos]
    depends_on: { migrar: { condition: service_completed_successfully } }

  worker:
    build: .
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-polizas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-polizas}"
      STORAGE_DIR: /datos/documentos
    volumes: [documentos:/datos/documentos]
    command: ["npm", "run", "worker"]
    depends_on: { migrar: { condition: service_completed_successfully } }

  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    command: ["caddy", "reverse-proxy", "--from", "${DOMINIO:?Define DOMINIO en .env}", "--to", "web:3000"]
    volumes: [caddy:/data]
    depends_on: [web]

volumes: { db: {}, documentos: {}, caddy: {} }
